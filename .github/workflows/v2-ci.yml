name: PICNYM V2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [v2/picnym-product]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Verify SEO output
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/privacy.html
          test -f dist/terms.html
          test -f dist/safety.html
          test -f dist/auth.js
          grep -q "PICNYM" dist/index.html

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/picnym-api/deno.json supabase/functions/picnym-api/index.ts
