name: PICNYM CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          SITE_URL: https://anonymous.gojodev.name.ng
      - name: Verify production output
        run: |
          test -f dist/auth.js
          test -f dist/auth-ui.js
          test -f dist/theme.js
          test -f dist/pro.js
          test -f dist/pro.css
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/features.html
          test -f dist/about.html
          test -f dist/privacy.html
          test -f dist/terms.html
          test -f dist/safety.html
          test -f dist/404.html
          test -f dist/offline.html
          test -f dist/favicon.ico
          test -f dist/favicon-48x48.png
          test -f dist/apple-touch-icon.png
          test -f dist/og-image.png
          grep -q "PICNYM" dist/index.html
          grep -q "picnym-api-v4" dist/config.js
          grep -q "PICNYM PREMIUM" dist/pro.js
          grep -q "anonymous.gojodev.name.ng" dist/sitemap.xml
          ! grep -R "PH X SFC" dist/index.html dist/app5.js dist/auth-ui.js dist/pro.js

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/picnym-api/deno.json supabase/functions/picnym-api/index.ts
      - run: deno check supabase/functions/picnym-api-v4/index.ts
      - name: Smoke test deployed APIs
        run: |
          CORE="https://ahvusnmuyfvdzjmdkgzj.supabase.co/functions/v1/picnym-api"
          V4="https://ahvusnmuyfvdzjmdkgzj.supabase.co/functions/v1/picnym-api-v4"
          curl --fail --silent --show-error "$CORE/api/health" | tee /tmp/core-health.json
          grep -q '"ok":true' /tmp/core-health.json
          curl --fail --silent --show-error "$V4/api/health" | tee /tmp/v4-health.json
          grep -q '"ok":true' /tmp/v4-health.json
          grep -q '"version":4' /tmp/v4-health.json
          status=$(curl --silent --output /tmp/account.json --write-out '%{http_code}' "$V4/api/account")
          test "$status" = "401"
          grep -q 'Sign in required' /tmp/account.json
